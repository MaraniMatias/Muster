[package]
name = "muster-core"
version = "0.1.0"
# 2021, matching the sources this crate took over from `src-tauri`. Those files
# are edition 2021 and `muster` -- the only consumer -- does not have to
# cross editions to depend on them.
edition = "2021"
publish = false
description = "Muster's host-independent core: the PTY backend and the workspace shapes its callers exchange. No window, no Tauri, no GPUI."

[lib]
name = "muster_core"
path = "src/lib.rs"

[dependencies]
# The PTY layer is not reimplemented here: these are the same crates the Tauri
# backend already used, and the code below is the code it used.
portable-pty = "0.9"
libc = "0.2"
log = "0.4"
# `workspace.rs` derives both halves; the terminal backend returns these types.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The OpenCode service is a loopback server a person starts; this client never
# starts one. No TLS: discovery refuses any address that is not loopback plain
# HTTP, so the scheme it could have spoken is never used.
ureq = { version = "3", default-features = false, features = ["json"] }
base64 = "0.22"
# Secure, automatically removed scratch files for Git diff snapshots.
tempfile = "3"
