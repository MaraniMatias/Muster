[package]
name = "muster-core"
version = "0.2.0"
edition = "2021"
rust-version = "1.97.1"
publish = false
description = "Muster's backend: PTY processes, Git, checkout files, persistence and agent integrations. No GUI dependencies."

[lib]
name = "muster_core"
path = "src/lib.rs"

[dependencies]
portable-pty = "0.9"
libc = "0.2"
log = "0.4"
# `workspace.rs` derives both halves; the terminal backend returns these types.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The OpenCode service is a loopback server a person starts; this client never
# starts one. No TLS: discovery refuses any address that is not loopback plain
# HTTP, so the scheme it could have spoken is never used.
ureq = { version = "3", default-features = false, features = ["json"] }
base64 = "0.22"
# Secure, automatically removed scratch files for Git diff snapshots.
tempfile = "3"
sha2 = "0.10"
