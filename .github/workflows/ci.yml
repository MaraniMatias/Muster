name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # The workspace is the two crates at the root: `core` and `native`. The Tauri tree under
  # `legacy/` is parked -- it is not built, not tested and not released from here, so nothing in
  # this workflow reaches into it.
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      # The Rust dependencies are the build's cost, and they only change when Cargo.lock does.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

      # The audit is the one thing here that is not `cargo`: it reads the locked graph, refuses any
      # path package it cannot hash-pin, and queries OSV. Node is needed for that alone.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test scripts/audit-rust.test.mjs
      - run: node scripts/audit-rust.mjs

      - run: cargo build --locked --release -p muster-native

  # macOS never compiles the Linux branches of the code, so nothing above would notice them
  # rotting. GPUI Kit has real Linux targets; building them is the point of this job.
  linux-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      # The Vulkan, X11 and Wayland development packages GPUI links against.
      - run: sudo apt-get update && sudo apt-get install -y libvulkan-dev libx11-dev libxkbcommon-dev
      - run: cargo build --locked -p muster-native