name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # The workspace is the two crates at the root: `core` and `native`. The Tauri tree under
  # `legacy/` is parked -- it is not built, not tested and not released from here, so nothing in
  # this workflow reaches into it.
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      # The Rust dependencies are the build's cost, and they only change when Cargo.lock does.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

      # The audit is the one thing here that is not `cargo`: it reads the locked graph, refuses any
      # path package it cannot hash-pin, and queries OSV. Node is needed for that alone, and for
      # the release command tests `scripts/release.sh check` runs beside the audit -- same two files,
      # so a release profile or command that breaks is caught here rather than at packaging.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test scripts/audit-rust.test.mjs scripts/release.test.mjs
      - run: node scripts/audit-rust.mjs

      - run: cargo build --locked --release -p muster
      # The macOS bundle is what carries the app's icon, name and version, so a
      # release build that cannot be bundled is a release build that would ship
      # without an identity.
      - run: scripts/bundle-macos.sh

  # macOS never compiles the Linux branches of the code, so nothing above would notice them
  # rotting. GPUI Kit has real Linux targets; building them is the point of this job. The core
  # suite runs here too, because half of it is POSIX behaviour the macOS runner cannot exercise:
  # the instance lock, symlink and O_NOFOLLOW refusals, process groups, signals. git is already on
  # the runner image and these tests create their own repositories.
  linux-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      # The Vulkan, X11 and XKB development packages GPUI links against, plus the
      # fontconfig one it loads through `yeslogic-fontconfig-sys`: without
      # `fontconfig.pc` the build script panics on a missing system library before
      # any of this app's own code is compiled.
      - run: sudo apt-get update && sudo apt-get install -y libvulkan-dev libx11-dev libxkbcommon-dev libfontconfig1-dev
      - run: cargo build --locked -p muster
      - run: cargo test --locked -p muster-core