name: Native release

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to validate and package
        required: true
        type: string
      mode:
        description: Validate only, or publish after all checks pass
        required: true
        type: choice
        options: [validate, publish]
        default: validate
      tag:
        description: New matching tag, e.g. v1.0.0-rc.3 (publish only)
        required: false
        type: string

# Every job below is read-only except `publish`, which is the only one that
# writes a tag and a release. The actions are pinned to the commit each
# readable tag points at, so a moved tag cannot change what runs here.
permissions:
  contents: read
concurrency:
  group: native-release-${{ inputs.tag || inputs.sha }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Require an exact commit
        env:
          SHA: ${{ inputs.sha }}
        run: '[[ "$SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Validate source, versions and publication policy
        id: metadata
        env:
          SHA: ${{ inputs.sha }}
          MODE: ${{ inputs.mode }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$SHA" ]]
          version="$(awk -F'"' '/^version = "/{print $2; exit}' app/Cargo.toml)"
          lock_version="$(awk '/^name = "muster"$/{f=1;next} f&&/^version = /{gsub(/"/,"");print $3;exit}' Cargo.lock)"
          [[ "$version" =~ ^(0\.[0-9]+\.[0-9]+|1\.0\.0(-rc\.[0-9]+)?)$ && "$version" == "$lock_version" ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$MODE" == publish ]]; then
            [[ "$GITHUB_REF" == refs/heads/main && "$TAG" == "v$version" ]]
            git fetch --no-tags origin main
            git merge-base --is-ancestor "$SHA" FETCH_HEAD
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
              echo "Tag already exists: $TAG"; exit 1
            else
              status=$?; [[ $status == 2 ]]
            fi
          fi

  linux:
    needs: source
    # Two architectures, each built on a runner of its own: a package that
    # names an architecture and carries the other one's binary installs and
    # then refuses to start, so the ARM64 package is built by an ARM64
    # toolchain rather than cross-compiled and renamed.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@59a558e8c538bf4a23bbffa19e5a278b703f2920 # 1.97.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      # `build-essential` is the C compiler: the tree-sitter grammars are C
      # sources, and the crate that builds them says so with `cc`.
      - run: sudo apt-get update && sudo apt-get install -y libvulkan-dev libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfreetype6-dev libfontconfig1-dev dpkg-dev zip unzip build-essential
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: . -> target
      - run: scripts/release.sh build
      - run: scripts/package-linux-deb.sh
      - name: Install and launch in a clean runtime container
        run: |
          docker run --rm --platform linux/${{ matrix.arch }} \
            -v "$PWD/dist:/artifacts:ro" -v "$PWD/scripts:/smoke:ro" \
            ubuntu:24.04 bash /smoke/linux-package-smoke.sh /artifacts/$(basename dist/*.deb)
      - name: Checksum package and record source
        env:
          SHA: ${{ inputs.sha }}
        run: cd dist && sha256sum *.deb > SHA256SUMS && printf '%s\n' "$SHA" > SOURCE_SHA
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-${{ matrix.arch }}-${{ inputs.sha }}
          path: |
            dist/*.deb
            dist/SHA256SUMS
            dist/SOURCE_SHA
          if-no-files-found: error
          retention-days: 30

  macos:
    needs: source
    # Apple Silicon and Intel are two builds, not one universal one: the
    # bundle carries one binary, and each architecture is built on a runner of
    # its own so the Mach-O it carries is the one the runner's toolchain made.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@59a558e8c538bf4a23bbffa19e5a278b703f2920 # 1.97.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: . -> target
      - run: scripts/release.sh release
      - name: Validate and archive bundle
        env:
          SHA: ${{ inputs.sha }}
          VERSION: ${{ needs.source.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          [[ "$(lipo -archs dist/Muster.app/Contents/MacOS/Muster)" == "$ARCH" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Muster.app/Contents/Info.plist)" == "$VERSION" ]]
          cd dist
          ditto -c -k --sequesterRsrc --keepParent Muster.app "Muster_${VERSION}_${ARCH}.zip"
          shasum -a 256 "Muster_${VERSION}_${ARCH}.zip" > SHA256SUMS
          printf '%s\n' "$SHA" > SOURCE_SHA
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-${{ matrix.arch }}-${{ inputs.sha }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
            dist/SOURCE_SHA
          if-no-files-found: error
          retention-days: 30

  finalize:
    needs: [source, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: '*-${{ inputs.sha }}'
          path: artifacts
      - name: Validate exact payloads without publication privileges
        env:
          SHA: ${{ inputs.sha }}
          VERSION: ${{ needs.source.outputs.version }}
        run: node scripts/finalize-native-release.mjs artifacts "$SHA" "$VERSION" release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-release-${{ inputs.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    if: inputs.mode == 'publish'
    needs: finalize
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # No checkout or execution of source in this write-enabled job.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: native-release-${{ inputs.sha }}
          path: release
      - name: Recheck payload and create the new release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$SHA" =~ ^[0-9a-f]{40}$ && "$TAG" =~ ^v(0\.[0-9]+\.[0-9]+|1\.0\.0(-rc\.[0-9]+)?)$ ]]
          cd release
          [[ "$(<SOURCE_SHA)" == "$SHA" ]]
          sha256sum -c SHA256SUMS
          shopt -s nullglob
          version="${TAG#v}"
          files=(*); [[ ${#files[@]} == 6 ]]
          [[ -s "muster_${version}_amd64.deb" && -s "muster_${version}_arm64.deb" ]]
          [[ -s "Muster_${version}_arm64.zip" && -s "Muster_${version}_x86_64.zip" ]]
          if git ls-remote --exit-code --tags "https://github.com/$REPO.git" "refs/tags/$TAG"; then
            echo "Tag already exists: $TAG"; exit 1
          else
            status=$?; [[ $status == 2 ]]
          fi
          object="$(gh api "repos/$REPO/git/tags" -f tag="$TAG" -f message="Release $TAG" -f object="$SHA" -f type=commit --jq .sha)"
          gh api "repos/$REPO/git/refs" -X POST -f ref="refs/tags/$TAG" -f sha="$object"
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease --latest=false); fi
          gh release create "$TAG" ./*.deb ./*.zip SHA256SUMS SOURCE_SHA --repo "$REPO" --verify-tag --draft --title "Muster $TAG" --notes "Native macOS arm64 and x86_64 and Ubuntu 24.04 amd64 and arm64 artifacts built and validated from $SHA." "${flags[@]}"
          gh release edit "$TAG" --repo "$REPO" --draft=false "${flags[@]}"
