name: Release
run-name: Release ${{ inputs.version }} at ${{ inputs.commit_sha }} ${{ inputs.validation_only && 'validation-only' || 'publish' }} [${{ inputs.request_id }}]

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA already pushed to main
        required: true
        type: string
      version:
        description: v0-prefixed release version
        required: true
        type: string
      validation_only:
        description: Build and validate all bundles without creating a tag or release
        required: true
        type: boolean
        default: false
      request_id:
        description: Unique orchestration correlation ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: muster-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
      recovery: ${{ steps.validate.outputs.recovery }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate trusted dispatch and immutable source
        id: validate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_SHA: ${{ inputs.commit_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          VALIDATION_ONLY: ${{ inputs.validation_only }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          [[ "$EVENT_NAME" == workflow_dispatch && "$DEFAULT_BRANCH" == main && "$EVENT_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || {
            echo "Release dispatch must run from the trusted default branch (main)." >&2; exit 1;
          }
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "commit_sha must be a full lowercase SHA." >&2; exit 1; }
          [[ "$RELEASE_VERSION" =~ ^v0\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || {
            echo "Only v0.*.* release versions are allowed." >&2; exit 1;
          }
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9_-]{1,80}$ ]] || { echo "Invalid request_id." >&2; exit 1; }
          git fetch --no-tags origin "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$RELEASE_SHA" "origin/$DEFAULT_BRANCH" || {
            echo "$RELEASE_SHA is not on $DEFAULT_BRANCH." >&2; exit 1;
          }
          [[ "$(git rev-parse "$RELEASE_SHA^{commit}")" == "$RELEASE_SHA" ]] || { echo "Commit SHA does not resolve exactly." >&2; exit 1; }
          node scripts/release.mjs --check "$RELEASE_VERSION"

          recovery=false
          remote_tag="$(git ls-remote --tags origin "refs/tags/$RELEASE_VERSION" "refs/tags/$RELEASE_VERSION^{}")"
          if [[ -n "$remote_tag" ]]; then
            tagged_sha="$(awk -v ref="refs/tags/$RELEASE_VERSION" '$2 == ref { direct = $1 } $2 == ref "^{}" { peeled = $1 } END { print peeled ? peeled : direct }' <<< "$remote_tag")"
            [[ "$tagged_sha" == "$RELEASE_SHA" ]] || { echo "$RELEASE_VERSION already points to a different commit." >&2; exit 1; }
            [[ "$VALIDATION_ONLY" != true ]] || { echo "Validation-only dispatch refuses an already-tagged version; it will not rebuild it." >&2; exit 1; }
            (( GITHUB_RUN_ATTEMPT > 1 )) || { echo "This version is already tagged; rerun its original workflow to reuse its artifacts." >&2; exit 1; }
            if ! git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION"; then
              git fetch --no-tags origin "refs/tags/$RELEASE_VERSION:refs/tags/$RELEASE_VERSION"
            fi
            [[ "$(git cat-file -t "refs/tags/$RELEASE_VERSION")" == tag ]] || { echo "Existing release tag is not the original annotated tag." >&2; exit 1; }
            tag_subject="$(git for-each-ref --format='%(contents:subject)' "refs/tags/$RELEASE_VERSION")"
            expected_tag_subject="Muster $RELEASE_VERSION at $RELEASE_SHA; workflow run $GITHUB_RUN_ID"
            [[ "$tag_subject" == "$expected_tag_subject" ]] || { echo "Existing tag does not belong to this exact workflow run; refusing recovery." >&2; exit 1; }
            recovery=true
          fi
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "recovery=$recovery" >> "$GITHUB_OUTPUT"
          echo "Validated $RELEASE_VERSION at $RELEASE_SHA (tagged recovery: $recovery)"

  checks:
    needs: validate
    if: ${{ needs.validate.outputs.recovery != 'true' }}
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}
    permissions:
      contents: read

  build:
    needs: [validate, checks]
    if: ${{ needs.validate.outputs.recovery != 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Install shared Linux prerequisites
        if: startsWith(matrix.runner, 'ubuntu-')
        run: bash scripts/install-linux-deps.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:app -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Collect and verify this target's final bundles
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: node scripts/release-artifacts.mjs collect --root src-tauri/target --target "$RELEASE_TARGET" --version "${RELEASE_VERSION#v}" --sha "$RELEASE_SHA" --out release-target
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: release-target/
          if-no-files-found: error

  validate-artifacts:
    needs: [validate, build]
    if: ${{ needs.validate.outputs.recovery != 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
      - name: Require every target and checksum the exact bundles
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release-artifacts.mjs finalize --root release-assets --out release-final --version "${RELEASE_VERSION#v}" --sha "$RELEASE_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: release-final-assets
          path: release-final/
          if-no-files-found: error

  publish:
    if: ${{ always() && inputs.validation_only == false && needs.validate.result == 'success' && (needs.validate.outputs.recovery == 'true' || needs.validate-artifacts.result == 'success') }}
    needs: [validate, validate-artifacts]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: release-final-assets
          path: release-final
      - name: Verify final payload and create the immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node scripts/release-artifacts.mjs verify --root release-final --version "${RELEASE_VERSION#v}" --sha "$RELEASE_SHA"
          (cd release-final && sha256sum -c SHA256SUMS)
          remote_tag="$(git ls-remote --tags origin "refs/tags/$RELEASE_VERSION" "refs/tags/$RELEASE_VERSION^{}")"
          if [[ -n "$remote_tag" ]]; then
            tagged_sha="$(awk -v ref="refs/tags/$RELEASE_VERSION" '$2 == ref { direct = $1 } $2 == ref "^{}" { peeled = $1 } END { print peeled ? peeled : direct }' <<< "$remote_tag")"
            [[ "$tagged_sha" == "$RELEASE_SHA" ]] || { echo "$RELEASE_VERSION already points elsewhere." >&2; exit 1; }
            if ! git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION"; then
              git fetch --no-tags origin "refs/tags/$RELEASE_VERSION:refs/tags/$RELEASE_VERSION"
            fi
            [[ "$(git cat-file -t "refs/tags/$RELEASE_VERSION")" == tag ]] || { echo "Existing tag is not annotated." >&2; exit 1; }
            tag_subject="$(git for-each-ref --format='%(contents:subject)' "refs/tags/$RELEASE_VERSION")"
            expected_tag_subject="Muster $RELEASE_VERSION at $RELEASE_SHA; workflow run $GITHUB_RUN_ID"
            [[ "$tag_subject" == "$expected_tag_subject" ]] || { echo "Existing tag does not belong to this exact workflow run." >&2; exit 1; }
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_VERSION" "$RELEASE_SHA" -m "Muster $RELEASE_VERSION at $RELEASE_SHA; workflow run $GITHUB_RUN_ID"
            git push origin "refs/tags/$RELEASE_VERSION"
          fi
      - name: Publish the already-validated payload (safe to retry)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find release-final -maxdepth 1 -type f -print | sort)
          expected_names="$(find release-final -maxdepth 1 -type f -exec basename {} \; | sort)"
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            [[ "$is_draft" == false ]] || { echo "Existing GitHub Release is a draft; refusing to publish into it." >&2; exit 1; }
            existing="$(gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)"
            missing=()
            while IFS= read -r asset; do
              [[ -n "$asset" ]] || continue
              if [[ ! -f "release-final/$asset" ]]; then echo "Unexpected existing asset: $asset" >&2; exit 1; fi
              gh release download "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir release-existing
              cmp -s "release-final/$asset" "release-existing/$asset" || { echo "Existing release asset differs: $asset" >&2; exit 1; }
            done <<< "$existing"
            for file in release-final/*; do
              asset="${file##*/}"
              if ! grep -Fxq "$asset" <<< "$existing"; then missing+=("$file"); fi
            done
            if [[ ${#missing[@]} -gt 0 ]]; then gh release upload "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" "${missing[@]}"; fi
          else
            notes=()
            if [[ -f CHANGELOG.md ]]; then
              curated="$(awk -v version="${RELEASE_VERSION#v}" '
                $0 == "## " version { inside = 1; next }
                inside && /^## / { exit }
                inside { print }
              ' CHANGELOG.md)"
              if [[ -n "$curated" ]]; then notes=(--notes "$curated"); fi
            fi
            gh release create "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" "${files[@]}" --verify-tag --title "Muster $RELEASE_VERSION" --generate-notes "${notes[@]}"
          fi
          actual="$(gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)"
          [[ "$actual" == "$expected_names" ]] || { echo "Published release assets are incomplete or unexpected." >&2; exit 1; }
